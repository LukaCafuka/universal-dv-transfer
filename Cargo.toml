[package]
name = "universal-dv-transfer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Buffered DV tape capture and recording for Windows, Linux and macOS"
license = "MIT"
build = "build.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]
ui-smoke = ["gui", "dep:image"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = "3"
directories = "6"
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
glob = "0.3"
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
lto = "thin"
strip = true
